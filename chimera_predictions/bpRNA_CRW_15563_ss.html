<!DOCTYPE html>

<style>

body { font-family: 'Segoe UI', Arial, sans-serif; background: #1a1a2e; color: #eee; padding: 10px; }

</head>
<body>

<script>

": "ins"}, {"i": 75, "j": 102, "domain": "ins"}, {"i": 76, "j": 101, "domain": "ins"}, {"i": 77, "j": 89, "domain": "ins"}, {"i": 85, "j": 123, "domain": "ins"}, {"i": 90, "j": 136, "domain": "ins"}, {"i": 103, "j": 120, "domain": "ins"}, {"i": 104, "j": 160, "domain": "ins"}, {"i": 105, "j": 159, "domain": "ins"}, {"i": 107, "j": 157, "domain": "ins"}, {"i": 113, "j": 162, "domain": "ins"}, {"i": 114, "j": 117, "domain": "ins"}, {"i": 115, "j": 116, "domain": "ins"}, {"i": 118, "j": 138, "domain": "ins"}, {"i": 119, "j": 137, "domain": "ins"}, {"i": 124, "j": 156, "domain": "ins"}, {"i": 129, "j": 143, "domain": "ins"}, {"i": 130, "j": 142, "domain": "ins"}, {"i": 131, "j": 141, "domain": "ins"}, {"i": 132, "j": 140, "domain": "ins"}, {"i": 133, "j": 139, "domain": "ins"}];

const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

// ── 自适应布局 ──
const baseWidth = 6;
const arcHeight = 60;
const marginX = 5;
const marginTop = 20;
const marginBottom = 30;

// 紧凑布局：bases on bottom, arcs above
const totalW = L * baseWidth + marginX * 2;
// 找出最宽嵌套深度
const depthCount = new Array(L).fill(0);
const depthStack = [];
for (const p of pairs) {
    depthStack.push(p);
}
// 简化：高度随 cross-pair 数量自适应
const crossCount = pairs.filter(p => p.domain === 'cross').length;
const innerCount = pairs.filter(p => p.domain !== 'cross').length;
const arcTotalH = Math.max(crossCount, innerCount) * 3 + 80;
const height = arcTotalH + 80;

canvas.width = totalW;
canvas.height = height;
ctx.clearRect(0, 0, canvas.width, canvas.height);

// ── 域分段背景 ──
const bgY = height - 50;
const barH = 40;
ctx.fillStyle = 'rgba(52,152,219,0.15)';
ctx.fillRect(marginX, bgY, insS * baseWidth, barH);
ctx.fillStyle = 'rgba(46,204,113,0.15)';
ctx.fillRect(marginX + insS * baseWidth, bgY, (insE - insS) * baseWidth, barH);
ctx.fillStyle = 'rgba(155,89,182,0.15)';
ctx.fillRect(marginX + insE * baseWidth, bgY, (L - insE) * baseWidth, barH);

// ── 碱基标尺 ──
ctx.fillStyle = '#aaa';
ctx.font = '8px monospace';
ctx.textAlign = 'center';
const seq = "UCAUCUGGUGAUGAUGCUCUUUAGGGUAACACCCGUUUUCCAUACGAUACGUAGCCGACCUGAGAGGGUGAUCGGCCACACUGGAACUGAGACACGGUCCAGACUCCUACGGGAGGCAGCAGUAGGGAAUCUUCCGCAAUGGGCGAAAGCCUGACGGAGCAACGCCGCGUGAGUGAUGA";
for (let i = 0; i < L; i++) {
    const x = marginX + i * baseWidth + baseWidth / 2;
    ctx.fillText(seq[i], x, height - 10);
    // 小竖线
    if (i % 10 === 0) {
        ctx.strokeStyle = '#555';
        ctx.lineWidth = 0.5;
        ctx.beginPath();
        ctx.moveTo(x, height - 50);
        ctx.lineTo(x, height - 15);
        ctx.stroke();
    }
}

// 域分隔线
ctx.strokeStyle = '#e74c3c';
ctx.lineWidth = 1.5;
ctx.setLineDash([4, 3]);
[insS, insE].forEach(pos => {
    const x = marginX + pos * baseWidth;
    ctx.beginPath();
    ctx.moveTo(x, 0);
    ctx.lineTo(x, height);
    ctx.stroke();
});
ctx.setLineDash([]);

// ── 分层画弧 ──
const domainColors = {
    cross: '#e67e22',
    t5:    '#3498db',
    ins:   '#2ecc71',
    t3:    '#9b59b6',
};

// 纵坐标分配：避免重叠
const levels = [];
for (const p of pairs) {
    let level = 0;
    for (const q of levels) {
        if (p.i < q.i && q.i < p.j && q.j < p.j) {
            level = Math.max(level, q.level + 1);
        }
        if (q.i < p.i && p.i < q.j && p.j < q.j) {
            level = Math.max(level, q.level + 1);
        }
    }
    p.level = level;
    levels.push(p);
}

for (const p of pairs) {
    const x1 = marginX + p.i * baseWidth + baseWidth / 2;
    const x2 = marginX + p.j * baseWidth + baseWidth / 2;
    const midX = (x1 + x2) / 2;
    const span = x2 - x1;

    const baseY = height - 55;
    const thisArcH = Math.min(span * 0.35, 100);
    const levelOffset = p.level * 5;
    const cy = baseY - thisArcH / 2 - levelOffset;

    ctx.strokeStyle = domainColors[p.domain] || '#aaa';
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.moveTo(x1, baseY);
    ctx.quadraticCurveTo(midX, cy, x2, baseY);
    ctx.stroke();

    // 端点小圆
    ctx.fillStyle = domainColors[p.domain] || '#aaa';
    ctx.beginPath();
    ctx.arc(x1, baseY, 2, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(x2, baseY, 2, 0, Math.PI * 2);
    ctx.fill();
}

// ── 域标签 ──
ctx.fillStyle = '#fff';
ctx.font = '10px Arial';
ctx.textAlign = 'center';
const mid5 = insS / 2;
const midIns = insS + (insE - insS) / 2;
const mid3 = insE + (L - insE) / 2;
ctx.fillText("5' tRNA", marginX + mid5 * baseWidth, 12);
ctx.fillText("Insert",  marginX + midIns * baseWidth, 12);
ctx.fillText("3' tRNA", marginX + mid3 * baseWidth, 12);

</script>
